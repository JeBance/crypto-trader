# ===========================================
# Crypto Trader - Конфигурация стратегий
# ===========================================
# Скопируйте этот файл в config.yaml и настройте под себя

# -------------------------------------------
# Торговые настройки
# -------------------------------------------
trading:
  mode: paper  # paper | live
  enabled: true
  
  # Активные биржи
  exchanges:
    - binance
    # - bybit
    # - okx
  
  # Торговые пары
  symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
  
  # Таймфреймы для анализа
  timeframes:
    - 1h
    - 4h
    - 1d

# -------------------------------------------
# Стратегии
# -------------------------------------------
strategies:
  # RSI стратегия
  rsi:
    enabled: false
    parameters:
      period: 14
      oversold: 30
      overbought: 70
    symbols:
      - BTCUSDT
    timeframe: 1h
    
  # MACD стратегия
  macd:
    enabled: false
    parameters:
      fast_period: 12
      slow_period: 26
      signal_period: 9
    symbols:
      - BTCUSDT
    timeframe: 4h
    
  # Crossover стратегия (SMA/EMA)
  crossover:
    enabled: false
    parameters:
      fast_period: 9
      slow_period: 21
      type: ema  # sma | ema
    symbols:
      - BTCUSDT
    timeframe: 1d

# -------------------------------------------
# Риск-менеджмент
# -------------------------------------------
risk:
  # Максимальный размер позиции (% от депозита)
  max_position_size_percent: 10
  
  # Стоп-лосс (%)
  stop_loss_percent: 2
  
  # Тейк-профит (%)
  take_profit_percent: 4
  
  # Trailing stop (%)
  trailing_stop_percent: 1
  
  # Лимит дневного убытка (%)
  daily_loss_limit_percent: 5
  
  # Максимальная просадка (%)
  max_drawdown_percent: 15
  
  # Максимум одновременных позиций
  max_open_positions: 3

# -------------------------------------------
# Уведомления
# -------------------------------------------
notifications:
  telegram:
    enabled: false
    notify_on:
      - order_filled
      - position_opened
      - position_closed
      - signal_generated
      - error
      - daily_report
    
  email:
    enabled: false
    smtp_server: smtp.gmail.com
    smtp_port: 587
    sender: your-email@gmail.com
    recipient: your-email@gmail.com
    
  daily_report:
    enabled: true
    time: "09:00"  # Время отчёта (UTC)

# -------------------------------------------
# Логирование
# -------------------------------------------
logging:
  level: INFO  # DEBUG | INFO | WARNING | ERROR
  file: logs/trader.log
  max_size_mb: 10
  backup_count: 5
  format: "%(asctime)s | %(levelname)-8s | %(name)s:%(lineno)d - %(message)s"

# -------------------------------------------
# База данных
# -------------------------------------------
database:
  type: sqlite
  path: data/crypto_trader.db
  
  # Настройки SQLAlchemy
  echo: false  # Логировать SQL запросы
  pool_size: 5
  max_overflow: 10

# -------------------------------------------
# API настройки
# -------------------------------------------
api:
  rate_limit:
    requests_per_second: 10
    burst: 20
    
  retry:
    max_attempts: 5
    backoff_min_seconds: 1
    backoff_max_seconds: 30
